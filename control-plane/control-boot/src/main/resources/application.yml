spring:
  application:
    name: control-plane
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/control_plane
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8081

security:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000
    issuer: intelligent-diagnosis
  lockout:
    max-attempts: ${SECURITY_LOCKOUT_MAX_ATTEMPTS:5}
    duration-minutes: ${SECURITY_LOCKOUT_DURATION_MINUTES:30}

data-plane:
  base-url: ${DATA_PLANE_BASE_URL:http://localhost:8082}

temporal:
  service-client:
    target: ${TEMPORAL_HOST:localhost}:7233

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,ratelimiters
  endpoint:
    health:
      probes:
        enabled: true

resilience4j:
  ratelimiter:
    configs:
      default:
        limit-for-period: 10
        limit-refresh-period: 1m
        timeout-duration: 0s
    instances:
      workflow-start:
        base-config: default

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
