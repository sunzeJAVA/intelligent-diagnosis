version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: id-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: control_plane
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: id-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: id-neo4j
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  temporal-db:
    image: postgres:16-alpine
    container_name: id-temporal-db
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.24
    container_name: id-temporal
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-db
      # DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development.yaml
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD", "bash", "-c", "temporal operator namespace list &> /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: id-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal-ui:
    image: temporalio/ui:latest
    container_name: id-temporal-ui
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:5173
    ports:
      - "8233:8080"

  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: id-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP

  control-plane:
    build:
      context: ../../
      dockerfile: control-plane/Dockerfile
    container_name: id-control-plane
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TEMPORAL_HOST: temporal
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_RESOURCE_ENV: docker
    ports:
      - "8081:8081"

  data-plane:
    build:
      context: ../../
      dockerfile: data-plane/Dockerfile
    container_name: id-data-plane
    depends_on:
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      QDRANT_HOST: qdrant
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      JAVA_PARSER_HOST: java-parser
      JAVA_PARSER_PORT: 9093
      CSHARP_PARSER_HOST: csharp-parser
      CSHARP_PARSER_PORT: 9094
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      REPOSITORY_ENCRYPTION_KEY: ${REPOSITORY_ENCRYPTION_KEY:?REPOSITORY_ENCRYPTION_KEY is required}
      LLM_API_KEY: ${LLM_API_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_RESOURCE_ENV: docker
    ports:
      - "8082:8082"

  java-parser:
    build:
      context: ../../
      dockerfile: parse-workers/java-parser/Dockerfile
    container_name: id-java-parser
    environment:
      GRPC_SERVER_PORT: 9093
      SERVER_PORT: 8083
    ports:
      - "8083:8083"
      - "9093:9093"

  csharp-parser:
    build:
      context: ../../
      dockerfile: parse-workers/csharp-parser/Dockerfile
    container_name: id-csharp-parser
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8084:8084"
      - "9094:9094"

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: id-frontend
    depends_on:
      - control-plane
      - data-plane
    ports:
      - "5173:80"

volumes:
  postgres-data:
  qdrant-storage:
  neo4j-data:
  temporal-db-data:
