spring:
  application:
    name: data-plane
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:control_plane}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:password}

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      show-components: always

qdrant:
  host: ${QDRANT_HOST:localhost}
  port: ${QDRANT_PORT:6334}
  collection-name: ${QDRANT_COLLECTION:code-elements}
  create-collection-if-missing: true

llm:
  provider: ${LLM_PROVIDER:mock}
  base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
  model: ${LLM_MODEL:gpt-4o-mini}
  api-key: ${LLM_API_KEY:}
  max-tokens: 2048
  timeout-seconds: 60

embedding:
  provider: ${EMBEDDING_PROVIDER:token-hash}
  openai:
    model: ${EMBEDDING_OPENAI_MODEL:text-embedding-3-small}
    dimension: 1536

diagnosis:
  top-k: 10

parse:
  workers:
    endpoints:
      java:
        host: ${JAVA_PARSER_HOST:localhost}
        port: ${JAVA_PARSER_PORT:9093}
      csharp:
        host: ${CSHARP_PARSER_HOST:localhost}
        port: ${CSHARP_PARSER_PORT:9094}

repository:
  initial-sync:
    enabled: false
  scheduled-sync:
    enabled: false
    cron: "0 0 * * * *"
  sync:
    timeout-seconds: 600

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
